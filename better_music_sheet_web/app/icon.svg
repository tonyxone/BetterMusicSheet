<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Browser-tab icon: a single eighth note on the site's paper background.
       Solid shapes and generous weights, because this is read at 16px. -->
  <rect width="32" height="32" rx="7" fill="#FAF3E6"/>
  <g fill="#A83C34">
    <!-- stem -->
    <rect x="17.6" y="6" width="2.6" height="16.5" rx="1.3"/>
    <!-- flag -->
    <path d="M20.2 6.4c3.6 1.5 5.8 3.6 5.8 6.6 0 1.5-.5 2.7-1.5 3.8.2-2.6-1.4-4.4-4.3-5.7z"/>
    <!-- notehead, tilted the way an engraved one is -->
    <ellipse cx="13.6" cy="22.6" rx="5.4" ry="4.1" transform="rotate(-20 13.6 22.6)"/>
  </g>
</svg>
