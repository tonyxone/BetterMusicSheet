<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Browser-tab icon: a single eighth note, no background plate. Solid
       shapes and generous weights, because this is read at 16px. -->
  <g fill="#000000">
    <!-- stem -->
    <rect x="17.4" y="4.5" width="3" height="18.5" rx="1.5"/>
    <!-- flag -->
    <path d="M20.4 4.9c4 1.7 6.4 4 6.4 7.3 0 1.7-.6 3-1.7 4.2.2-2.9-1.5-4.9-4.7-6.3z"/>
    <!-- notehead, tilted the way an engraved one is -->
    <ellipse cx="12.8" cy="23.2" rx="6.2" ry="4.7" transform="rotate(-20 12.8 23.2)"/>
  </g>
</svg>
