name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (unchecked builds and pushes images only)
        type: boolean
        default: false

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC -> AWS
  contents: read

jobs:
  preflight:
    name: Decide what to deploy
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.mode.outputs.deploy }}
      target: ${{ steps.mode.outputs.target }}
    steps:
      - id: mode
        env:
          DEPLOY: ${{ github.event_name == 'release' || inputs.deploy }}
          READY: ${{ vars.SERVERLESS_READY }}
          API: ${{ vars.API_LAMBDA_FUNCTION }}
          CONTROLLER: ${{ vars.CONTROLLER_LAMBDA_FUNCTION }}
          WORKER: ${{ vars.WORKER_ECS_SERVICE }}
          LEGACY: ${{ vars.ECS_SERVICE }}
        run: |
          # Publishing a release always deploys. SERVERLESS_READY only chooses
          # WHICH stack, so cutting a tag part-way through the migration never
          # needs someone to remember to flip something first, and flipping it
          # back is the deployment half of the cutover rollback.
          TARGET=legacy
          if [ "$READY" = true ]; then TARGET=serverless; fi
          if [ "$DEPLOY" = true ]; then
            if [ "$TARGET" = serverless ]; then
              test -n "$API" && test -n "$CONTROLLER" && test -n "$WORKER" || {
                echo "SERVERLESS_READY is true but the Lambda/worker variables are not set."
                echo "Set them from terraform output - see docs/serverless-migration.md step 5."
                exit 1
              }
            else
              test -n "$LEGACY" || { echo "ECS_SERVICE is unset; there is nothing to deploy."; exit 1; }
            fi
          fi
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Deploy: $DEPLOY, target: $TARGET" >> "$GITHUB_STEP_SUMMARY"

  push-image:
    name: Build and push API and worker images
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      image: ${{ steps.image.outputs.image }}
      api-image: ${{ steps.image.outputs.api-image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fetch Audiveris (Linux build)
        run: |
          mkdir -p tools/Audiveris/Audiveris/app
          aws s3 cp "${{ vars.AUDIVERIS_S3_URI }}" - | tar xz -C tools/Audiveris/Audiveris/app

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ github.event.release.tag_name || format('migration-{0}', github.sha) }}
        run: |
          # Both images are built on every release. The API image is unused
          # while the legacy stack is live, but having it already in ECR is what
          # lets the serverless stack be provisioned without a special build.
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker build -f Dockerfile.api -t "$REGISTRY/$REPOSITORY:api-$TAG" .
          docker run --rm --entrypoint python -e JOB_BACKEND=sqs "$REGISTRY/$REPOSITORY:api-$TAG" -c 'import server, controller, sys; assert "pymupdf" not in sys.modules; assert "run" not in sys.modules'
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          docker push "$REGISTRY/$REPOSITORY:api-$TAG"
          echo "image=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"
          echo "api-image=$REGISTRY/$REPOSITORY:api-$TAG" >> "$GITHUB_OUTPUT"
          echo "Worker: $REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $REGISTRY/$REPOSITORY:api-$TAG" >> "$GITHUB_STEP_SUMMARY"

  deploy-legacy:
    name: Deploy the ECS API service
    runs-on: ubuntu-latest
    needs: [preflight, push-image]
    if: needs.preflight.outputs.deploy == 'true' && needs.preflight.outputs.target == 'legacy'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Fetch the running task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_FAMILY }}" \
            --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

      - name: Point it at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ needs.push-image.outputs.image }}

      - name: Register the new revision and deploy it
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

  deploy-serverless:
    name: Deploy Lambda API and ECS worker
    runs-on: ubuntu-latest
    needs: [preflight, push-image]
    if: needs.preflight.outputs.deploy == 'true' && needs.preflight.outputs.target == 'serverless'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      # Read-only probes first. The deploy role's permissions were still
      # scoped to the stack the migration deleted, and that only surfaced after
      # a six-minute image build - fail in seconds instead, with a message that
      # names the cause.
      - name: Check the deploy role can reach the stack
        env:
          API_FUNCTION: ${{ vars.API_LAMBDA_FUNCTION }}
          CONTROLLER_FUNCTION: ${{ vars.CONTROLLER_LAMBDA_FUNCTION }}
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          WORKER: ${{ vars.WORKER_ECS_SERVICE }}
        run: |
          for FUNCTION in "$API_FUNCTION" "$CONTROLLER_FUNCTION"; do
            aws lambda get-function --function-name "$FUNCTION" --query 'Configuration.FunctionName' --output text
          done
          aws ecs describe-services --cluster "$CLUSTER" --services "$WORKER"             --query 'services[0].serviceName' --output text

      - name: Deploy Lambda code
        env:
          API_IMAGE: ${{ needs.push-image.outputs.api-image }}
          API_FUNCTION: ${{ vars.API_LAMBDA_FUNCTION }}
          CONTROLLER_FUNCTION: ${{ vars.CONTROLLER_LAMBDA_FUNCTION }}
        run: |
          for FUNCTION in "$API_FUNCTION" "$CONTROLLER_FUNCTION"; do
            aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$API_IMAGE" --query 'FunctionName'
            aws lambda wait function-updated --function-name "$FUNCTION"
          done

      - name: Fetch the worker task definition
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.WORKER_ECS_SERVICE }}
        run: |
          TASK=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK" \
            --query taskDefinition \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

      - name: Point it at the new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: worker
          image: ${{ needs.push-image.outputs.image }}

      - name: Register the new revision and deploy it
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ vars.WORKER_ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Terraform cannot ignore the worker image the way it ignores the Lambda
      # ones: ECS keeps image, command and every environment variable in a
      # single container_definitions attribute, and ignore_changes is per
      # attribute. So an apply run with a stale var file reverts the worker.
      # Print the replacement lines here, where they are easy to act on.
      - name: Say what infra/serverless.tfvars should now hold
        env:
          WORKER_IMAGE: ${{ needs.push-image.outputs.image }}
          API_IMAGE: ${{ needs.push-image.outputs.api-image }}
        run: |
          {
            echo '## Update `infra/serverless.tfvars`'
            echo ''
            echo 'Terraform still believes the previous images are wanted. Until these'
            echo 'lines are updated, the next apply - for any reason - rolls the worker'
            echo 'back. The daily drift check reports it if this is missed.'
            echo ''
            echo '```hcl'
            echo "serverless_api_image    = \"$API_IMAGE\""
            echo "serverless_worker_image = \"$WORKER_IMAGE\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ui:
    name: Build and deploy the web UI
    runs-on: ubuntu-latest
    needs: [preflight, deploy-legacy, deploy-serverless]
    # Exactly one of the deploy jobs runs and the other is skipped, so this
    # waits on "nothing failed" rather than on either one succeeding.
    if: ${{ !cancelled() && !failure() && needs.preflight.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: better_music_sheet_web/package-lock.json

      - name: Install dependencies
        working-directory: better_music_sheet_web
        run: npm ci

      # NEXT_PUBLIC_* values are inlined into the bundle at build time, not
      # read at runtime - a static export has no server to read them from.
      # Leaving the Cognito pair unset just hides the Sign in button (see
      # lib/cognito.ts); `terraform output` supplies both values.
      - name: Build static export
        working-directory: better_music_sheet_web
        env:
          NEXT_PUBLIC_API_BASE: https://${{ vars.API_SUBDOMAIN }}
          NEXT_PUBLIC_COGNITO_REGION: ${{ vars.AWS_REGION }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ vars.COGNITO_APP_CLIENT_ID }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-skip-session-tagging: true

      - name: Sync to S3
        run: aws s3 sync better_music_sheet_web/out/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
